apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: fcg
  labels:
    app: postgres
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: fcg
  labels:
    app: rabbitmq
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: "fcg"
  RABBITMQ_DEFAULT_PASS: "fcg"
---
apiVersion: v1
kind: Secret
metadata:
  name: fcg-users-secret
  namespace: fcg
  labels:
    app: fcg-users-api
type: Opaque
stringData:
  ConnectionStrings__DbConnection: "Host=postgres;Port=5432;Database=fcg_users;Username=postgres;Password=postgres"
  RabbitMq__Username: "fcg"
  RabbitMq__Password: "fcg"
  TokenSettings__Key: "fcg-phase2-shared-jwt-key-0123456789-abcdefghijklmnopqrstuvwxyz"
---
